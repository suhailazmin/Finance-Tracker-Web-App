<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover lets the app draw behind the notch; the layout pads with safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#285C45" />
    <!-- Opened from the Home Screen: full screen with no browser bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Monetra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Monetra – Expenses Tracker</title>

    <script>
      // Splash plays once per launch: skip it for reloads in the same session
      try {
        if (sessionStorage.getItem('monetra:splash-seen')) document.documentElement.classList.add('no-splash')
        else sessionStorage.setItem('monetra:splash-seen', '1')
      } catch (e) {
        // storage blocked: just show the splash
      }
      // Safety net: never cover the app for long, even if it fails to start
      setTimeout(function () {
        var splash = document.getElementById('splash')
        if (splash) splash.remove()
      }, 8000)
    </script>

    <!-- Splash styles are inline so they apply before the app's CSS and JS have loaded -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 75% at 50% 38%, #3d7a5c 0%, #285c45 55%, #1f4a37 100%);
        color: #f8f6ef;
        font-family: 'Nunito Variable', ui-rounded, system-ui, sans-serif;
        overflow: hidden;
      }
      html.no-splash #splash {
        display: none;
      }
      .splash-logo {
        position: relative;
        width: 128px;
        height: 128px;
      }
      .splash-logo img {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 18px 40px -12px rgb(0 0 0 / 0.45);
        animation: splash-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      /* soft rings that pulse out from the squirrel */
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgb(221 234 223 / 0.6);
        opacity: 0;
        animation: splash-pulse 1.8s ease-out 0.55s infinite;
      }
      .splash-ring.late {
        animation-delay: 1.15s;
      }
      /* little coins floating up */
      .splash-coin {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e9a15c;
        box-shadow: inset 0 0 0 3px #f5c38f;
        opacity: 0;
        animation: splash-coin 1.7s ease-out infinite;
      }
      .splash-coin.c1 { left: -22px; bottom: 26px; animation-delay: 0.7s; }
      .splash-coin.c2 { right: -18px; top: 30px; width: 11px; height: 11px; animation-delay: 1.05s; }
      .splash-coin.c3 { left: 18px; top: -18px; width: 9px; height: 9px; animation-delay: 1.4s; }
      .splash-word {
        display: flex;
        margin-top: 30px;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .splash-word span {
        display: inline-block;
        opacity: 0;
        animation: splash-rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(0.45s + var(--i) * 55ms);
      }
      .splash-tag {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: #ddeadf;
        opacity: 0;
        animation: splash-fade 0.6s ease-out 1s both;
      }
      .splash-bar {
        position: absolute;
        bottom: calc(56px + env(safe-area-inset-bottom));
        width: 120px;
        height: 4px;
        border-radius: 4px;
        background: rgb(248 246 239 / 0.18);
        overflow: hidden;
        opacity: 0;
        animation: splash-fade 0.4s ease-out 0.9s both;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #e9a15c;
        animation: splash-load 1.1s ease-in-out infinite;
      }
      #splash.leaving {
        animation: splash-out 0.45s ease-in both;
      }
      @keyframes splash-pop {
        0% { transform: scale(0.3) rotate(-14deg); opacity: 0; }
        60% { opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
      }
      @keyframes splash-pulse {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.75); opacity: 0; }
      }
      @keyframes splash-coin {
        0% { transform: translateY(10px) scale(0.6); opacity: 0; }
        25% { opacity: 1; }
        100% { transform: translateY(-48px) scale(1); opacity: 0; }
      }
      @keyframes splash-rise {
        from { transform: translateY(16px); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @keyframes splash-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes splash-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @keyframes splash-out {
        to { transform: scale(1.06); opacity: 0; }
      }
      /* Reduce Motion: a still splash that simply fades */
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash * {
          animation: none !important;
        }
        .splash-word span,
        .splash-tag {
          opacity: 1;
        }
        .splash-ring,
        .splash-coin,
        .splash-bar {
          display: none;
        }
        #splash {
          transition: opacity 0.2s;
        }
        #splash.leaving {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Monetra">
      <div class="splash-logo" aria-hidden="true">
        <span class="splash-ring"></span>
        <span class="splash-ring late"></span>
        <span class="splash-coin c1"></span>
        <span class="splash-coin c2"></span>
        <span class="splash-coin c3"></span>
        <img src="/src/assets/monetra-icon.png" alt="" width="128" height="128" />
      </div>
      <div class="splash-word" aria-hidden="true">
        <span style="--i: 0">M</span><span style="--i: 1">o</span><span style="--i: 2">n</span><span style="--i: 3">e</span><span style="--i: 4">t</span><span style="--i: 5">r</span><span style="--i: 6">a</span>
      </div>
      <div class="splash-tag" aria-hidden="true">EXPENSES TRACKER</div>
      <div class="splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
