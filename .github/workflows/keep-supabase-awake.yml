# Supabase pauses free-plan projects after ~7 days without activity.
# This runs a tiny read-only query twice a week so the project stays awake.
# It uses the public anon key, so row-level security returns no rows; the query still counts as activity.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 2 * * 1,4' # Mondays and Thursdays, 02:00 UTC (10:00 Malaysia time)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          # same names as in .env.local
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          # Fail loudly (GitHub emails you) if the project is already paused or unreachable
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not respond normally (HTTP $status). Check whether the project is paused."
            exit 1
          fi
